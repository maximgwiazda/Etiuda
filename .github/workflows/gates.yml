# The gates, on a machine that is not this desk.
#
# WHY. Every gate in this repository has only ever run where it was written: one Windows desk
# with a catalog beside the engine, a name list inside .git, and node_modules already there. A
# gate that needs any of those and says so is honest; a gate that needs one and passes anyway
# because the desk happens to have it is a green for the wrong reason, and this file is how that
# difference is measured. A clean clone has no fixtures, no name list and no catalog.
#
# WHAT RUNS is the four commands that need nothing but the tree: npm ci, the build, the split
# guard and the unit suite. Everything else in package.json - smoke, shell-smoke, desk, csp,
# catalog-watch, reinstall, storage-carry - drives a browser or installs the product, and belongs
# to the desk and to tools/release.mjs rather than here.
#
# TWO JOBS SINCE BOARD ITEM 629, and the same four commands in each. Of the 71 leaf gates the two
# trees run, 41 run on Linux unchanged and 6 are Windows by nature, so the honest shape is two
# harnesses rather than one: Linux proves the application, Windows keeps proving the installer and
# the shell's own guards. The danger in that shape is not the gate that fails on Linux, which is
# loud, but the reader who takes a green Linux run for a green run. So the linux job's summary
# carries, beside what stood down, the seven things tests/engine.js names as never looked at off
# Windows - and tools/job-summary.mjs REFUSES if that notice is missing from the log, so the
# channel cannot quietly close and leave a bare green behind. The same step runs in both jobs,
# where it asserts the mirror: a Windows log carrying that notice is a fault too.
#
# WHAT WAS MEASURED ON THE DESK BEFORE THIS WAS WRITTEN, because nothing here has ever run on
# Linux and a prediction is not a measurement. Each of the 34 steps of the two chains was run
# twice, once ordinarily and once under a patched process.platform of "linux", on 2026-09-20 at
# f8bc632. 27 of 34 behaved identically. 7 died in esbuild's platform-specific binary, which is
# the patch and not Linux - a real runner's npm ci fetches the right one. One real fault came out
# of it: case 25 of tests/engine-selftest.js asserted that a clean verdict says NOTHING extra,
# which is false anywhere but Windows, and it is fixed in the same commit as this file. So the
# step this expects to be red on a first real run is NONE - and that is a prediction, which the
# run itself will either keep or correct.
#
# WHAT STANDS DOWN, and it says so rather than passing quietly. ETIUDA_FIXTURES is deliberately
# not set, because a catalog is somebody's content and it is not going into a runner. Measured in
# a clean clone on 2026-09-15, four lines of `npm test` name what that costs:
#
#     no untypeable character in the engine's interface; the catalog half was NOT RUN
#     NOT RUN: ETIUDA_FIXTURES is unset, so no catalog was linted
#     NOT RUN: ETIUDA_FIXTURES is unset
#     RESULT: OK - NOT RUN: 3d's catalog half, 4, 5
#
# tests/test.js prints those itself and exits 0; nothing here weakens a check to get a green. The
# last step of each job copies those lines into that job's summary, so a green run on GitHub still
# says out loud which halves of it were not checked. And ETIUDA_FIXTURES pointed at a folder that is not there
# is NOT a stand-down: tests/engine.js refuses with exit 78 and the run goes red. Measured both
# ways; the control is in the report for board item 397.
#
# THE NAME SCAN does not arise in EITHER JOB and must not be made to. It lives in
# tools/pre-commit, it is installed by hand as a git hook, hooks are not cloned, and the list it
# reads is at .git/etiuda-names, which no clone carries because a list of names that may not be
# published is itself a thing that may not be published. Its only other caller is
# tools/release.mjs, which reports NOT RUN when the list is absent rather than passing. No step
# of either job below invokes it, and none of them may be changed to; a runner is the last place
# to hand that list, and a second runner is not a second reason to.
#
# ENABLING THIS IS NOT THIS FILE'S DECISION. Committed on a branch it runs nowhere. Merged to
# main it starts spending Actions minutes on every push and every pull request, which is the
# owner's call and not the harness's.
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # electron and electron-builder are devDependencies and npm ci fetches them, which is most
      # of this step. Nothing below launches either; the build needs esbuild and the rest is node.
      - run: npm ci

      - run: npm run build

      - run: npm run split-guard

      # bash rather than the default shell, because Actions runs `bash -eo pipefail` and the pipe
      # into tee therefore still fails the step on a red suite. Proved locally against the same
      # shell, both ways round, rather than assumed.
      - name: npm test
        shell: bash
        run: npm test 2>&1 | tee test.log

      # One step in both jobs, and a file rather than a grep so that it can be driven on the desk
      # against a log with the notice, one without it and one that stops early. It refuses rather
      # than shrugging: a summary that quietly lost what the run did not check is the shape of an
      # early victory, and this job is the place that shape would first appear. It also echoes
      # every FAIL line as an ::error:: command, board item 427: this job has been red since
      # 2026-09-18 and what it said has never been read here, because a log needs a sign-in and an
      # annotation does not. No redirection, because the tool writes the summary file itself and
      # keeps stdout for those commands.
      - name: what did not run, and what this platform cannot prove
        if: always()
        shell: bash
        run: node tools/job-summary.mjs test.log

  # THE SAME FOUR COMMANDS ON LINUX, board item 629. Nothing here is weakened to get a green: a
  # gate that cannot run off Windows says NOT RUN through the channel board item 628 built, and a
  # gate that fails here is a finding rather than a step to skip. What this job cannot see is in
  # its own summary, seven lines, written by the harness and not by this file.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # esbuild's binary is platform-specific and this is where the right one arrives: the same
      # commands run on the desk under a patched process.platform die in it, which is why that
      # measurement speaks for the branch taken and never for the platform.
      - run: npm ci

      - run: npm run build

      - run: npm run split-guard

      - name: npm test
        shell: bash
        run: npm test 2>&1 | tee test.log

      - name: what did not run, and what this platform cannot prove
        if: always()
        shell: bash
        run: node tools/job-summary.mjs test.log
