# The top block is the live Worker etiuda-relay-staging, on etiuda.dev/relay/v1/*, with its objects and its bucket.
# A deploy with no environment targets this block. [env.staging] is the separate Worker etiuda-relay-g2,
# on etiuda.dev/relay-staging/v1/*. It holds no secret, only bindings.
name = "etiuda-relay-staging"
main = "worker.mjs"
compatibility_date = "2026-09-01"
# shell/relay/blob.cjs and the relay's own signatures use node:crypto.
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# The relay answers at the one address Studio and the desk call, and the site on etiuda.dev keeps every other path.
routes = [{ pattern = "etiuda.dev/relay/v1/*", zone_name = "etiuda.dev" }]

# The relay logs nothing per request.
[observability]
enabled = false

# One object per team, named by its relay team id. A binding takes no jurisdiction here, so worker.mjs asks every id
# of TEAMS.jurisdiction("eu"), and the objects are made and kept in the EU.
[[durable_objects.bindings]]
name = "TEAMS"
class_name = "RelayTeam"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayTeam"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "etiuda-relay-staging"
jurisdiction = "eu"

[env.staging]
# Deployed only by `wrangler deploy --env staging`, by a chief of staff.
name = "etiuda-relay-g2"
routes = [{ pattern = "etiuda.dev/relay-staging/v1/*", zone_name = "etiuda.dev" }]

[env.staging.vars]
API_PREFIX = "/relay-staging/v1/"

[[env.staging.durable_objects.bindings]]
name = "TEAMS"
class_name = "RelayTeam"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RelayTeam"]

[[env.staging.r2_buckets]]
binding = "BLOBS"
bucket_name = "etiuda-relay-g2"
jurisdiction = "eu"
